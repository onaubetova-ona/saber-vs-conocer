<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="tool">
  <meta name="design-style" content="haven">
  <title>Práctica: saber y conocer</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;

      /* Page and surfaces (Haven) */
      --background: #f5f6f5;
      --surface-container-low: #ffffff;
      --surface-container: #e3ebe2;
      --surface-container-high: #dbe2dd;

      /* Ink */
      --on-surface: #23272a;
      --on-surface-variant: #5c6468;

      /* Rules */
      --outline: #c9d0cc;
      --outline-variant: #dde2df;

      /* Accents */
      --primary: #3c5a6e;
      --primary-hover: #2d4657;
      --on-primary: #ffffff;
      --primary-container: #e2e9ee;
      --on-primary-container: #2a4152;
      --secondary: #4f6b53;
      --tertiary: #5f7c63;
      --error: #a63d32;
      --on-error: #ffffff;
      --error-container: #f7e9e7;
      --on-error-container: #6e231b;

      /* Data series */
      --data-1: #3c5a6e;
      --data-2: #5f7c63;
      --data-3: #a8694a;
      --data-4: #8a7a68;
      --data-context: #c3cac6;

      /* Fonts */
      --font-headline: 'Outfit', sans-serif;
      --font-body: 'Hanken Grotesk', sans-serif;
      --font-label: 'Outfit', sans-serif;

      /* Shape */
      --rounded: 0.375rem;
      --rounded-lg: 0.5rem;
      --rounded-full: 9999px;

      /* Style effects */
      --hairline: 1px solid var(--outline-variant);
      --hairline-control: 1px solid var(--outline);
      --hairline-positive: 1px solid var(--positive);
      --hairline-error: 1px solid var(--error);
      --hairline-primary: 1px solid var(--primary);
      --elevation: none;

      /* Shared semantic tokens */
      --positive: #3b6e4c;
      --positive-container: #e3ebe2;
      --on-positive-container: #24452f;
      --warning: #8f6224;
      --focus: var(--primary);

      /* Type scale (Focused Tool) */
      --display-size: clamp(1.75rem, 1.4rem + 1.2vw, 2.25rem);
      --headline-size: clamp(1.25rem, 1.1rem + 0.5vw, 1.5rem);
      --subhead-size: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
      --body-size: clamp(0.9375rem, 0.9rem + 0.15vw, 1rem);
      --label-size: 0.75rem;

      /* Spacing scale */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;
      --space-2xl: 4rem;
      --space-3xl: 6rem;

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
      --dur-long: 420ms;
    }

    /* Base reset */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: clip; margin: 0; padding: 0; }
    header { position: static !important; }

    body {
      background-color: var(--background);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
    }

    button:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .page-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--space-lg);
      padding: var(--space-xl) var(--space-lg) var(--space-2xl);
      max-width: 64rem;
      margin: 0 auto;
      overflow: hidden;
    }
    .page-grid * { min-width: 0; }

    /* Header */
    .practice-header {
      display: grid;
      gap: var(--space-xs);
    }

    .label {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 500;
      letter-spacing: 0.015em;
      text-transform: none;
      color: var(--on-surface-variant);
    }

    .headline {
      font-family: var(--font-headline);
      font-size: var(--display-size);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.08;
      color: var(--on-surface);
      margin: 0;
    }

    .headline strong {
      font-weight: 600;
    }

    .caption-sage {
      font-family: var(--font-body);
      font-size: var(--subhead-size);
      font-weight: 500;
      color: var(--secondary);
      margin: var(--space-xs) 0 0;
      max-width: 62ch;
    }

    /* Scoreboard & Progress Summary */
    .summary-strip {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--space-md);
    }

    .panel {
      background: var(--surface-container-low);
      border: var(--hairline);
      border-radius: var(--rounded-lg);
      box-shadow: var(--elevation);
      padding: var(--space-md) var(--space-lg);
    }

    .metric-tile {
      display: grid;
      gap: var(--space-xs);
      align-content: start;
    }

    .metric-value {
      font-family: var(--font-headline);
      font-size: clamp(1.5rem, 1.25rem + 0.8vw, 1.875rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--on-surface);
      font-variant-numeric: tabular-nums;
    }

    .metric-value--primary {
      color: var(--primary);
    }

    .metric-caption {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--secondary);
    }

    .progress-wrap {
      display: grid;
      gap: var(--space-xs);
      margin-top: var(--space-xs);
    }

    .progress-track {
      width: 100%;
      height: 0.375rem;
      background-color: var(--outline-variant);
      border-radius: var(--rounded-full);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--primary);
      border-radius: var(--rounded-full);
      transition: width var(--dur-short) var(--ease-out);
    }

    /* Controls bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      padding-top: var(--space-sm);
      border-top: var(--hairline);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded);
      font-family: var(--font-label);
      font-size: 0.9375rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      border: var(--hairline-control);
      background-color: var(--surface-container-low);
      color: var(--on-surface);
      transition: background-color var(--dur-micro) var(--ease-out),
                  color var(--dur-micro) var(--ease-out),
                  border-color var(--dur-micro) var(--ease-out);
    }

    .btn:hover:not(:disabled) {
      background-color: var(--surface-container-high);
    }

    .btn--active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary);
    }

    .btn--active:hover:not(:disabled) {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn--reset-armed {
      background-color: var(--error-container);
      border-color: var(--error);
      color: var(--on-error-container);
    }

    .btn--reset-armed:hover:not(:disabled) {
      background-color: var(--error-container);
    }

    /* Questions list */
    .questions-list {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--space-md);
    }

    .question-card {
      container-type: inline-size;
      display: grid;
      gap: var(--space-md);
      transition: border-color var(--dur-micro) var(--ease-out);
    }

    .question-card--correct {
      border-color: var(--positive);
    }

    .question-card--wrong {
      border-color: var(--error);
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--rounded-full);
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 500;
      letter-spacing: 0.015em;
    }

    .status-tag--pending {
      background-color: var(--background);
      color: var(--on-surface-variant);
    }

    .status-tag--correct {
      background-color: var(--positive-container);
      color: var(--on-positive-container);
    }

    .status-tag--wrong {
      background-color: var(--error-container);
      color: var(--on-error-container);
    }

    .sentence-text {
      margin: 0;
      font-size: clamp(1.0625rem, 1rem + 0.3vw, 1.1875rem);
      line-height: 1.55;
      color: var(--on-surface);
      max-width: 65ch;
    }

    .blank-slot {
      display: inline-block;
      min-width: 5.5rem;
      text-align: center;
      padding: 0 var(--space-sm);
      margin: 0 var(--space-xs);
      border-bottom: 2px solid var(--primary);
      font-family: var(--font-headline);
      font-weight: 500;
      color: var(--primary);
      background-color: var(--primary-container);
      border-radius: var(--rounded);
    }

    .blank-slot--correct {
      border-bottom-color: var(--positive);
      background-color: var(--positive-container);
      color: var(--on-positive-container);
    }

    .blank-slot--wrong {
      border-bottom-color: var(--error);
      background-color: var(--error-container);
      color: var(--on-error-container);
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-sm);
    }

    @container (max-width: 520px) {
      .options-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .option-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: var(--space-sm);
      min-height: 2.75rem;
      padding: var(--space-sm) var(--space-md);
      background-color: var(--surface-container-low);
      border: var(--hairline-control);
      border-radius: var(--rounded);
      color: var(--on-surface);
      font-size: var(--body-size);
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background-color var(--dur-micro) var(--ease-out),
                  border-color var(--dur-micro) var(--ease-out),
                  color var(--dur-micro) var(--ease-out);
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--surface-container-high);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      flex-shrink: 0;
      border-radius: var(--rounded);
      background-color: var(--background);
      color: var(--on-surface-variant);
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 500;
    }

    .option-btn--selected-correct {
      background-color: var(--positive-container);
      border-color: var(--positive);
      color: var(--on-positive-container);
    }

    .option-btn--selected-correct .option-key {
      background-color: var(--positive);
      color: var(--on-primary);
    }

    .option-btn--selected-wrong {
      background-color: var(--error-container);
      border-color: var(--error);
      color: var(--on-error-container);
    }

    .option-btn--selected-wrong .option-key {
      background-color: var(--error);
      color: var(--on-error);
    }

    .option-btn--reveal-correct {
      background-color: var(--positive-container);
      border-color: var(--positive);
      color: var(--on-positive-container);
    }

    .option-btn--reveal-correct .option-key {
      background-color: var(--positive);
      color: var(--on-primary);
    }

    .option-btn--dimmed {
      opacity: 0.62;
    }

    .feedback-line {
      min-height: 1.5rem;
      font-size: 0.9375rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .feedback-line--correct {
      color: var(--positive);
    }

    .feedback-line--wrong {
      color: var(--error);
    }

    /* Empty filter state & Completion banner */
    .empty-state,
    .completion-panel {
      display: grid;
      gap: var(--space-sm);
      justify-items: start;
    }

    .completion-panel {
      background-color: var(--surface-container);
      border-color: var(--outline);
    }

    .completion-title {
      font-family: var(--font-headline);
      font-size: var(--headline-size);
      font-weight: 500;
      margin: 0;
      color: var(--on-surface);
    }

    .completion-copy {
      margin: 0;
      color: var(--on-surface);
      max-width: 60ch;
    }

    .completion-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      margin-top: var(--space-xs);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .page-grid {
        padding: var(--space-md) var(--space-sm) var(--space-xl);
        gap: var(--space-md);
      }
      .summary-strip {
        grid-template-columns: minmax(0, 1fr);
      }
      .panel {
        padding: var(--space-md);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page-grid">
    <header class="practice-header">
      <span class="label">Práctica de español · 12 oraciones</span>
      <h1 class="headline">Completa con <strong>saber o conocer</strong></h1>
      <p class="caption-sage">Selecciona la opción correcta en cada oración para ver tu resultado al instante.</p>
    </header>

    <section class="summary-strip" aria-label="Resumen de puntuación">
      <div class="panel metric-tile">
        <span class="label">Puntuación</span>
        <div class="metric-value metric-value--primary" id="score-value">0 / 12</div>
        <div class="progress-wrap">
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span class="metric-caption" id="score-caption">0 % de aciertos</span>
        </div>
      </div>

      <div class="panel metric-tile">
        <span class="label">Respondidas</span>
        <div class="metric-value" id="answered-value">0 / 12</div>
        <span class="metric-caption" id="remaining-caption">Quedan 12 por responder</span>
      </div>

      <div class="panel metric-tile">
        <span class="label">Errores</span>
        <div class="metric-value" id="errors-value">0</div>
        <span class="metric-caption" id="status-caption">Listo para empezar</span>
      </div>
    </section>

    <section class="controls-bar" aria-label="Controles de práctica">
      <div class="filter-group" role="group" aria-label="Filtrar oraciones">
        <button type="button" class="btn btn--active" id="filter-all" onclick="setFilter('all')">Todas (12)</button>
        <button type="button" class="btn" id="filter-pending" onclick="setFilter('pending')">Pendientes (12)</button>
        <button type="button" class="btn" id="filter-correct" onclick="setFilter('correct')">Correctas (0)</button>
        <button type="button" class="btn" id="filter-wrong" onclick="setFilter('wrong')">Incorrectas (0)</button>
      </div>
      <button type="button" class="btn" id="reset-btn" data-armed="false" onclick="handleReset(this)">Reiniciar práctica</button>
    </section>

    <section id="completion-container" aria-live="polite"></section>

    <section class="questions-list" id="questions-container" aria-label="Lista de preguntas"></section>
  </main>

  <api-shim></api-shim>

  <script>
    const QUESTIONS = [
      {
        id: 1,
        before: `Yo no`,
        after: `dónde está la estación de tren.`,
        options: [`sé`, `conozco`, `sabe`, `conoce`],
        answer: `sé`
      },
      {
        id: 2,
        before: `¿Tú`,
        after: `a la nueva profesora de historia?`,
        options: [`sabes`, `conoces`, `sabe`, `conoce`],
        answer: `conoces`
      },
      {
        id: 3,
        before: `María`,
        after: `tocar la guitarra muy bien.`,
        options: [`sabe`, `conoce`, `sé`, `conozco`],
        answer: `sabe`
      },
      {
        id: 4,
        before: `Nosotros`,
        after: `muy bien las calles del centro.`,
        options: [`sabemos`, `conocemos`, `saben`, `conocen`],
        answer: `conocemos`
      },
      {
        id: 5,
        before: `¿Ustedes`,
        after: `a qué hora empieza la película?`,
        options: [`saben`, `conocen`, `sabemos`, `conocemos`],
        answer: `saben`
      },
      {
        id: 6,
        before: `Mis padres no`,
        after: `la ciudad de Sevilla todavía.`,
        options: [`saben`, `conocen`, `sabe`, `conoce`],
        answer: `conocen`
      },
      {
        id: 7,
        before: `Yo`,
        after: `a tu hermano desde hace muchos años.`,
        options: [`sé`, `conozco`, `sabes`, `conoces`],
        answer: `conozco`
      },
      {
        id: 8,
        before: `¿`,
        after: `tú nadar en el mar?`,
        options: [`Sabes`, `Conoces`, `Sabe`, `Conoce`],
        answer: `Sabes`
      },
      {
        id: 9,
        before: `Elena`,
        after: `toda la obra de Gabriel García Márquez.`,
        options: [`sabe`, `conoce`, `sabes`, `conoces`],
        answer: `conoce`
      },
      {
        id: 10,
        before: `Nosotros no`,
        after: `si va a llover mañana.`,
        options: [`sabemos`, `conocemos`, `saben`, `conocen`],
        answer: `sabemos`
      },
      {
        id: 11,
        before: `¿Vosotros`,
        after: `ese restaurante cerca de la plaza?`,
        options: [`sabéis`, `conocéis`, `saben`, `conocen`],
        answer: `conocéis`
      },
      {
        id: 12,
        before: `Ellos`,
        after: `hablar tres idiomas con fluidez.`,
        options: [`saben`, `conocen`, `sabéis`, `conocéis`],
        answer: `saben`
      }
    ];

    const OPTION_KEYS = [`A`, `B`, `C`, `D`];

    let appState = {
      answers: {},
      filter: `all`
    };

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, `&amp;`)
        .replace(/</g, `&lt;`)
        .replace(/>/g, `&gt;`)
        .replace(/"/g, `&quot;`);
    }

    async function persistState() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === `function`) {
          await window.notebookAppApi.setAppState({
            answers: appState.answers,
            filter: appState.filter
          });
        }
      } catch (err) {
        // Ignorar error de almacenamiento en entorno sin shim activo
      }
    }

    function computeStats() {
      let answered = 0;
      let correct = 0;
      let wrong = 0;
      let pending = 0;

      for (let i = 0; i < QUESTIONS.length; i++) {
        const q = QUESTIONS[i];
        const chosen = appState.answers[String(q.id)];
        if (typeof chosen === `string` && chosen.length > 0) {
          answered += 1;
          if (chosen === q.answer) {
            correct += 1;
          } else {
            wrong += 1;
          }
        } else {
          pending += 1;
        }
      }

      const total = QUESTIONS.length;
      const pct = answered > 0 ? Math.round((correct / total) * 100) : 0;

      return { total, answered, correct, wrong, pending, pct };
    }

    function updateSummary(stats) {
      const scoreValue = document.getElementById(`score-value`);
      const scoreCaption = document.getElementById(`score-caption`);
      const progressFill = document.getElementById(`progress-fill`);
      const answeredValue = document.getElementById(`answered-value`);
      const remainingCaption = document.getElementById(`remaining-caption`);
      const errorsValue = document.getElementById(`errors-value`);
      const statusCaption = document.getElementById(`status-caption`);

      if (scoreValue) scoreValue.textContent = `${stats.correct} / ${stats.total}`;
      if (scoreCaption) scoreCaption.textContent = `${stats.pct} % de aciertos`;
      if (progressFill) progressFill.style.width = `${Math.round((stats.answered / stats.total) * 100)}%`;
      if (answeredValue) answeredValue.textContent = `${stats.answered} / ${stats.total}`;
      if (remainingCaption) {
        if (stats.pending === 0) {
          remainingCaption.textContent = `Todas las oraciones respondidas`;
        } else if (stats.pending === 1) {
          remainingCaption.textContent = `Queda 1 por responder`;
        } else {
          remainingCaption.textContent = `Quedan ${stats.pending} por responder`;
        }
      }
      if (errorsValue) errorsValue.textContent = String(stats.wrong);
      if (statusCaption) {
        if (stats.answered === 0) {
          statusCaption.textContent = `Listo para empezar`;
        } else if (stats.answered < stats.total) {
          statusCaption.textContent = `Práctica en curso`;
        } else {
          statusCaption.textContent = `Práctica completada`;
        }
      }

      const btnAll = document.getElementById(`filter-all`);
      const btnPending = document.getElementById(`filter-pending`);
      const btnCorrect = document.getElementById(`filter-correct`);
      const btnWrong = document.getElementById(`filter-wrong`);

      if (btnAll) {
        btnAll.textContent = `Todas (${stats.total})`;
        btnAll.classList.toggle(`btn--active`, appState.filter === `all`);
      }
      if (btnPending) {
        btnPending.textContent = `Pendientes (${stats.pending})`;
        btnPending.classList.toggle(`btn--active`, appState.filter === `pending`);
      }
      if (btnCorrect) {
        btnCorrect.textContent = `Correctas (${stats.correct})`;
        btnCorrect.classList.toggle(`btn--active`, appState.filter === `correct`);
      }
      if (btnWrong) {
        btnWrong.textContent = `Incorrectas (${stats.wrong})`;
        btnWrong.classList.toggle(`btn--active`, appState.filter === `wrong`);
      }
    }

    function renderCompletion(stats) {
      const container = document.getElementById(`completion-container`);
      if (!container) return;

      if (stats.answered < stats.total) {
        container.innerHTML = ``;
        return;
      }

      const accuracy = Math.round((stats.correct / stats.total) * 100);
      const wrongBtnHtml = stats.wrong > 0
        ? `<button type="button" class="btn" onclick="setFilter('wrong')">Ver incorrectas (${stats.wrong})</button>`
        : ``;

      container.innerHTML = `
        <div class="panel completion-panel">
          <span class="label">Resultado final</span>
          <h2 class="completion-title">Has completado las 12 oraciones: ${stats.correct} de ${stats.total} aciertos (${accuracy} %)</h2>
          <p class="completion-copy">${stats.wrong === 0 ? `Puntuación perfecta en todas las oraciones.` : `Puedes revisar las oraciones con error o reiniciar para intentarlo otra vez.`}</p>
          <div class="completion-actions">
            ${wrongBtnHtml}
            <button type="button" class="btn btn--active" onclick="clearPractice()">Practicar de nuevo</button>
          </div>
        </div>
      `;
    }

    function renderQuestions() {
      const container = document.getElementById(`questions-container`);
      if (!container) return;

      const filtered = [];
      for (let i = 0; i < QUESTIONS.length; i++) {
        const q = QUESTIONS[i];
        const chosen = appState.answers[String(q.id)];
        const isAnswered = typeof chosen === `string` && chosen.length > 0;
        const isCorrect = isAnswered && chosen === q.answer;

        if (appState.filter === `pending` && isAnswered) continue;
        if (appState.filter === `correct` && !isCorrect) continue;
        if (appState.filter === `wrong` && (!isAnswered || isCorrect)) continue;

        filtered.push(q);
      }

      if (filtered.length === 0) {
        const emptyLabels = {
          pending: `No quedan oraciones pendientes por responder.`,
          correct: `Todavía no hay respuestas correctas en esta sesión.`,
          wrong: `No hay respuestas incorrectas registradas.`
        };
        const msg = emptyLabels[appState.filter] || `No hay oraciones para mostrar en este filtro.`;
        container.innerHTML = `
          <div class="panel empty-state">
            <span class="label">Vista filtrada</span>
            <p class="sentence-text">${escapeHtml(msg)}</p>
            <button type="button" class="btn" onclick="setFilter('all')">Mostrar todas las oraciones</button>
          </div>
        `;
        return;
      }

      let html = ``;
      for (let i = 0; i < filtered.length; i++) {
        const q = filtered[i];
        const chosen = appState.answers[String(q.id)];
        const isAnswered = typeof chosen === `string` && chosen.length > 0;
        const isCorrect = isAnswered && chosen === q.answer;

        let cardClass = `panel question-card`;
        let tagClass = `status-tag status-tag--pending`;
        let tagText = `Pendiente`;
        let blankClass = `blank-slot`;
        let blankText = `______`;
        let feedbackHtml = `<div class="feedback-line" aria-live="polite"></div>`;

        if (isAnswered && isCorrect) {
          cardClass += ` question-card--correct`;
          tagClass = `status-tag status-tag--correct`;
          tagText = `Correcta`;
          blankClass += ` blank-slot--correct`;
          blankText = chosen;
          feedbackHtml = `<div class="feedback-line feedback-line--correct" aria-live="polite">Correcto: «${escapeHtml(q.answer)}» completa la oración.</div>`;
        } else if (isAnswered && !isCorrect) {
          cardClass += ` question-card--wrong`;
          tagClass = `status-tag status-tag--wrong`;
          tagText = `Incorrecta`;
          blankClass += ` blank-slot--wrong`;
          blankText = chosen;
          feedbackHtml = `<div class="feedback-line feedback-line--wrong" aria-live="polite">Incorrecto. La forma correcta es «${escapeHtml(q.answer)}».</div>`;
        }

        let optionsHtml = ``;
        for (let j = 0; j < q.options.length; j++) {
          const opt = q.options[j];
          const key = OPTION_KEYS[j];
          let optClass = `option-btn`;

          if (isAnswered) {
            if (opt === chosen && isCorrect) {
              optClass += ` option-btn--selected-correct`;
            } else if (opt === chosen && !isCorrect) {
              optClass += ` option-btn--selected-wrong`;
            } else if (!isCorrect && opt === q.answer) {
              optClass += ` option-btn--reveal-correct`;
            } else {
              optClass += ` option-btn--dimmed`;
            }
          }

          optionsHtml += `
            <button
              type="button"
              class="${optClass}"
              ${isAnswered ? `disabled` : ``}
              onclick="selectOption(${q.id}, ${j})"
              aria-label="Opción ${key}: ${escapeHtml(opt)}">
              <span class="option-key" aria-hidden="true">${key}</span>
              <span>${escapeHtml(opt)}</span>
            </button>
          `;
        }

        const sentenceContent = q.before === `¿`
          ? `¿<span class="${blankClass}">${escapeHtml(blankText)}</span>${escapeHtml(q.after)}`
          : `${escapeHtml(q.before)} <span class="${blankClass}">${escapeHtml(blankText)}</span> ${escapeHtml(q.after)}`;

        html += `
          <article class="${cardClass}" id="question-${q.id}">
            <div class="question-meta">
              <span class="label">Oración ${q.id} de ${QUESTIONS.length}</span>
              <span class="${tagClass}">${tagText}</span>
            </div>
            <p class="sentence-text">${sentenceContent}</p>
            <div class="options-grid" role="group" aria-label="Opciones para la oración ${q.id}">
              ${optionsHtml}
            </div>
            ${feedbackHtml}
          </article>
        `;
      }

      container.innerHTML = html;
    }

    function renderAll() {
      const stats = computeStats();
      updateSummary(stats);
      renderCompletion(stats);
      renderQuestions();
    }

    function selectOption(questionId, optionIndex) {
      let target = null;
      for (let i = 0; i < QUESTIONS.length; i++) {
        if (QUESTIONS[i].id === questionId) {
          target = QUESTIONS[i];
          break;
        }
      }
      if (!target) return;

      const key = String(questionId);
      if (typeof appState.answers[key] === `string` && appState.answers[key].length > 0) {
        return;
      }

      const chosen = target.options[optionIndex];
      if (typeof chosen !== `string`) return;

      appState.answers[key] = chosen;
      resetArmClear();
      renderAll();
      persistState();
    }

    function setFilter(nextFilter) {
      appState.filter = nextFilter;
      resetArmClear();
      renderAll();
      persistState();
    }

    function resetArmClear() {
      const resetBtn = document.getElementById(`reset-btn`);
      if (resetBtn) {
        resetBtn.dataset.armed = `false`;
        resetBtn.textContent = `Reiniciar práctica`;
        resetBtn.classList.remove(`btn--reset-armed`);
      }
    }

    function clearPractice() {
      appState.answers = {};
      appState.filter = `all`;
      resetArmClear();
      renderAll();
      persistState();
    }

    function handleReset(btn) {
      if (!btn) return;
      if (btn.dataset.armed !== `true`) {
        btn.dataset.armed = `true`;
        btn.textContent = `Pulsa otra vez para reiniciar`;
        btn.classList.add(`btn--reset-armed`);
        return;
      }
      clearPractice();
    }

    async function initPractice() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
          const saved = await window.notebookAppApi.getAppState();
          if (saved && typeof saved === `object`) {
            if (saved.answers && typeof saved.answers === `object`) {
              appState.answers = saved.answers;
            }
            if (typeof saved.filter === `string`) {
              appState.filter = saved.filter;
            }
          }
        }
      } catch (err) {
        // Iniciar limpio si no hay estado previo disponible
      }

      renderAll();

      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
          window.notebookAppApi.notifyAppReady();
        }
      } catch (err) {
        // Ignorar si notifyAppReady no está disponible fuera del visor
      }
    }

    initPractice();
  </script>
</body>
</html>
